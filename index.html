<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday HanKuri 🎂</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* canvas */
canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* countdown */
#countdown{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.box{
border:1px solid gold;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px gold;
}

.timer{
display:flex;
gap:10px;
justify-content:center;
margin-top:15px;
}

.timer span{
color:gold;
font-size:1.8rem;
}

/* hidden */
.hidden{display:none;}

/* header */
header{
text-align:center;
padding:20px;
}

header h1 span{color:gold;}

button{
padding:10px 15px;
border:none;
background:gold;
border-radius:10px;
cursor:pointer;
}

/* gallery */
.gallery{
padding:30px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
}

.card{
border:1px solid gold;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

/* intro */
#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader{
width:200px;
height:6px;
background:#222;
margin-top:20px;
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:gold;
animation:load 4s linear forwards;
}

@keyframes load{
to{width:100%;}
}

/* dropbox */
#deactivateBox{
position:fixed;
top:15px;
right:15px;
background:rgba(0,0,0,0.85);
border:1px solid gold;
padding:12px;
border-radius:10px;
width:200px;
z-index:999;
}

.smallTimer{
color:gold;
font-size:13px;
margin-top:5px;
}

/* farewell */
#farewell{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
text-align:center;
z-index:9999;
}

.farewellBox{
border:1px solid gold;
padding:25px;
border-radius:15px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<h1 style="color:gold;">🎂 Happy Birthday HanKuri</h1>
<p>Loading experience...</p>
<div class="loader"><div class="bar"></div></div>
</div>

<canvas id="fx"></canvas>

<!-- COUNTDOWN -->
<div id="countdown">
<div class="box">
<h2>Countdown</h2>

<div class="timer">
<div><span id="d">0</span>D</div>
<div><span id="h">0</span>H</div>
<div><span id="m">0</span>M</div>
<div><span id="s">0</span>S</div>
</div>

</div>
</div>

<!-- MAIN -->
<main id="main" class="hidden">

<header>
<h1>Happy Birthday <span>HanKuri</span> 🎂</h1>
<button onclick="toggleMusic()">Music</button>
</header>

<section class="gallery" id="grid"></section>

<section style="text-align:center;padding:20px;">
<p>💛 A special message for you 💛</p>
<p>You are loved beyond words.</p>
</section>

</main>

<!-- DROPBOX -->
<div id="deactivateBox" class="hidden">
<div>⚠️ Ends soon</div>
<div class="smallTimer" id="dbox">--</div>
</div>

<!-- FAREWELL -->
<div id="farewell" class="hidden">
<div class="farewellBox">
<h1>💛 Experience Ended</h1>
<p>Happy Birthday HanKuri</p>
</div>
</div>

<audio id="music" loop>
<source src="Oh My God [F3u80TkBVAA].mp3">
</audio>

<script>

/* ===================== TIMING ===================== */
const birthdayStart = Date("June 13, 2026 00:00:00");
const endTime = Date("June 14, 2026 00:00:00");
/* ===================== MUSIC ===================== */
const music = document.getElementById("music");
function toggleMusic(){
music.paused ? music.play() : music.pause();
}

/* ===================== INTRO ===================== */
function startIntro(){
setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("main").classList.remove("hidden");
music.play().catch(()=>{});
startFX();
},4000);
}

/* ===================== UPDATE ===================== */
function update(){
const now = Date.now();

if(now >= endTime){
showFarewell();
return;
}

if(now >= birthdayStart){

document.getElementById("deactivateBox").classList.remove("hidden");

let diff = endTime - now;
document.getElementById("dbox").innerText =
Math.floor(diff/1000) + "s left";

if(!window.started){
window.started = true;
startIntro();
}
return;
}

let diff = birthdayStart - now;

document.getElementById("d").innerText=Math.floor(diff/86400000);
document.getElementById("h").innerText=Math.floor(diff/3600000%24);
document.getElementById("m").innerText=Math.floor(diff/60000%60);
document.getElementById("s").innerText=Math.floor(diff/1000%60);
}

/* ===================== FAREWELL ===================== */
function showFarewell(){
document.getElementById("main").classList.add("hidden");
document.getElementById("deactivateBox").classList.add("hidden");
document.getElementById("farewell").classList.remove("hidden");
music.pause();
}

/* ===================== FIREWORKS (FIXED + STRONG) ===================== */
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let fireworks = [];

function createFirework(){
const x = Math.random() * canvas.width;
const y = Math.random() * canvas.height * 0.5;

for(let i=0;i<60;i++){
fireworks.push({
x,
y,
vx:(Math.random()-0.5)*8,
vy:(Math.random()-0.5)*8,
alpha:1,
fade:Math.random()*0.02 + 0.01,
size:Math.random()*2.5 + 1
});
}
}

function draw(){
ctx.fillStyle = "rgba(0,0,0,0.25)";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=fireworks.length-1;i>=0;i--){
let f = fireworks[i];

ctx.beginPath();
ctx.globalAlpha = f.alpha;
ctx.fillStyle = "gold";
ctx.arc(f.x,f.y,f.size,0,Math.PI*2);
ctx.fill();

f.x += f.vx;
f.y += f.vy;
f.alpha -= f.fade;

if(f.alpha <= 0){
fireworks.splice(i,1);
}
}

ctx.globalAlpha = 1;
requestAnimationFrame(draw);
}
draw();

function startFX(){
setInterval(createFirework, 700);
}

/* ===================== LOOP ===================== */
setInterval(update, 1000);
update();

</script>

</body>
</html>
